repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (npm ci required)
        entry: npm run lint --
        language: system
        pass_filenames: false
        types_or: [javascript]
      - id: bandit
        name: Bandit production security checks
        entry: bandit -r order_profitability_predictor -x order_profitability_predictor/tests
        language: python
        additional_dependencies: [bandit==1.9.2]
        pass_filenames: false
        types: [python]
